<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Atualizar ficha técnica</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f4f7fb; color: #172b4d;
         font-family: Inter, Roboto, "Segoe UI", sans-serif; }
  .topbar { background: #c9595b; padding: 14px 24px 0; }
  .tab { display: inline-block; background: #fff; border-radius: 8px 8px 0 0; padding: 10px 20px;
         font-size: 12px; font-weight: 700; letter-spacing: .04em; color: #0b3b66; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fafafa; border: 1px solid #dfe3ea; border-radius: 6px; padding: 18px 20px; margin-bottom: 16px; }
  h1 { font-size: 15px; margin: 0 0 4px; padding-bottom: 8px; border-bottom: 2px solid #0b3b66; color: #0b3b66; }
  .sub { font-size: 13px; color: #5e6c84; margin: 10px 0 16px; }
  form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #0b3b66; }
  input { width: 200px; padding: 9px 10px; border: 1px solid #b9c4d6; border-radius: 4px; font-size: 16px; }
  input:focus { outline: 2px solid #005cbb; outline-offset: -1px; }
  button { padding: 10px 20px; border: 0; border-radius: 4px; background: #6aa65a; color: #fff;
           font-weight: 700; font-size: 13px; text-transform: uppercase; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 4px; font-size: 14px; display: none; }
  .msg.ok { display: block; background: #e6f4e2; color: #24561a; }
  .msg.erro { display: block; background: #fde7e7; color: #8a1c1c; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e3e6ec; }
  th { background: #eef1f6; color: #0b3b66; }
  td.num { text-align: right; }
  .vazio { color: #5e6c84; font-size: 13px; }
  .ignoradas { font-size: 13px; color: #5e6c84; margin-top: 12px; }
  .ignoradas li { margin: 2px 0; }
  .hidden { display: none; }

  /* Aberta dentro do Uniplus (iframe do Tampermonkey): só o painel aparece, o resto fica translúcido */
  html.embutido, html.embutido body { background: transparent !important; }
  html.embutido body { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; }
  html.embutido .painel { width: 100%; max-width: 760px; background: #f4f7fb; border-radius: 12px; overflow: hidden;
                          box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  html.embutido main { margin: 0; padding: 16px; max-width: none; }
  html.embutido .card:last-child { margin-bottom: 0; }
</style>
<script>
  // Marca antes de desenhar a página para não piscar o fundo branco
  if (window.self !== window.top) document.documentElement.classList.add('embutido');
</script>
</head>
<body>
<div class="painel">
<header class="topbar"><span class="tab">FICHA TÉCNICA</span></header>
<main>
  <section class="card">
    <h1>Atualizar ficha técnica pela DAV</h1>
    <p class="sub">Informe o código da DAV. A ficha dos produtos pai é refeita a partir das linhas
      <b>[PAI …]</b> da observação gravada no Uniplus. Linhas de texto livre são ignoradas.</p>
    <form id="form">
      <label>Código da DAV
        <input id="codigo" type="number" min="1" step="1" inputmode="numeric" required autofocus>
      </label>
      <button id="btn" type="submit">Atualizar ficha (Enter)</button>
    </form>
    <div id="msg" class="msg" role="status"></div>
  </section>

  <section id="resultado" class="card hidden">
    <h1 id="titulo">Ficha gravada</h1>
    <div id="tabela"></div>
    <div id="ignoradas" class="ignoradas"></div>
  </section>
</main>
</div>

<script>
(function () {
  'use strict';
  // ?teste=1 usa a URL de teste do n8n (botão "Listen for test event")
  var teste = /[?&]teste=1\b/.test(location.search);
  var URL_N8N = 'https://n8n.srv1149367.hstgr.cloud/' + (teste ? 'webhook-test' : 'webhook') + '/ficha-tecnica-dav';

  var form = document.getElementById('form');
  var campo = document.getElementById('codigo');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  var resultado = document.getElementById('resultado');

  function mostrar(tipo, texto) { msg.className = 'msg ' + tipo; msg.textContent = texto; }
  function el(tag, texto, cls) {
    var e = document.createElement(tag);
    if (texto !== undefined) e.textContent = texto;
    if (cls) e.className = cls;
    return e;
  }
  function qtd(n) { return Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 3 }); }

  function renderizar(r) {
    document.getElementById('titulo').textContent = 'Ficha gravada — DAV ' + r.dav;
    var box = document.getElementById('tabela');
    box.innerHTML = '';
    var fichas = r.fichas || [];
    if (!fichas.length) {
      box.appendChild(el('p', 'A observação desta DAV não tem nenhuma linha [PAI …]. Nenhuma ficha foi alterada.', 'vazio'));
    } else {
      var t = el('table');
      var head = el('tr');
      ['Produto pai', 'Componente (filho)', 'Quantidade'].forEach(function (h) { head.appendChild(el('th', h)); });
      t.appendChild(head);
      fichas.forEach(function (f) {
        var tr = el('tr');
        tr.appendChild(el('td', f.pai));
        tr.appendChild(el('td', f.filho));
        tr.appendChild(el('td', qtd(f.qtd), 'num'));
        t.appendChild(tr);
      });
      box.appendChild(t);
    }
    var ign = document.getElementById('ignoradas');
    ign.innerHTML = '';
    if ((r.ignoradas || []).length) {
      ign.appendChild(el('div', 'Linhas da observação ignoradas (não são componentes):'));
      var ul = el('ul');
      r.ignoradas.forEach(function (l) { ul.appendChild(el('li', l)); });
      ign.appendChild(ul);
    }
    resultado.classList.remove('hidden');
  }

  // Aberta dentro do WebUniPlus (Tampermonkey): Esc fecha a janela sobreposta
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && window.parent !== window) window.parent.postMessage('tv-fechar', '*');
  });

  if (window.self !== window.top) {
    document.addEventListener('mousedown', function (ev) {
      if (ev.target === document.body || ev.target === document.documentElement) window.parent.postMessage('tv-fechar', '*');
    });
  }

  // ?codigo=123 já preenche o campo
  var pre = (location.search.match(/[?&]codigo=(\d+)/) || [])[1];
  if (pre) campo.value = pre;

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var codigo = campo.value.trim();
    if (!codigo) { campo.focus(); return; }
    btn.disabled = true;
    resultado.classList.add('hidden');
    mostrar('ok', 'Atualizando a ficha da DAV ' + codigo + '…');

    fetch(URL_N8N, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo: Number(codigo) })
    })
      .then(function (resp) {
        return resp.text().then(function (txt) {
          var dados = null;
          try { dados = JSON.parse(txt); } catch (e) { /* resposta não-JSON */ }
          if (!resp.ok && !dados) throw new Error('O n8n respondeu ' + resp.status + '.');
          return dados || {};
        });
      })
      .then(function (r) {
        if (!r.ok) {
          mostrar('erro', r.erro || 'Não foi possível atualizar a ficha.');
          return;
        }
        var n = (r.fichas || []).length;
        mostrar('ok', n ? 'Ficha atualizada: ' + n + ' componente(s) gravado(s).' : 'DAV encontrada, mas sem componentes para gravar.');
        renderizar(r);
      })
      .catch(function (e) {
        mostrar('erro', 'Falha ao falar com o n8n: ' + e.message + (teste ? ' (no modo teste, clique antes em "Listen for test event").' : ''));
      })
      .finally(function () {
        btn.disabled = false;
        campo.focus();
        campo.select();
      });
  });
})();
</script>
</body>
</html>
